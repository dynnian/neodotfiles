[scratchpads.youtube]
command = "foot -T yt-x -a yt-x yt-x"
class = "yt-x"
size = "65% 65%"
animation = "fromTop"
multi = false

[scratchpads.audiomixer]
command = "foot -T pulsemixer -a pulsemixer pulsemixer"
class = "pulsemixer"
size = "65% 65%"
