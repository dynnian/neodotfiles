[pyprland]
plugins = [
    "scratchpads"
]

[scratchpads.music]
command = "foot -T cmus -a cmus cmus"
class = "cmus"
size = "65% 65%"
animation = "fromTop"
multi = false

[scratchpads.file]
command = "foot -T yazi -a yazi yazi"
class = "yazi"
size = "65% 65%"
animation = "fromTop"
multi = false

[scratchpads.rss]
command = "foot -T newsboat -a newsboat newsboat"
class = "newsboat"
size = "65% 65%"
animation = "fromTop"
multi = false

[scratchpads.anime]
command = "foot -T ani-cli -a ani-cli ani-cli"
class = "ani-cli"
size = "65% 65%"
animation = "fromTop"
multi = false

