# neowm configuration (NeoConf format)
# See neowm(1) for every key. Lines starting with # are comments.

tags = ["", "󰙨", "󰖟", "󰭹", "󱡭", "󰕧", "󰏘", "󰈙", "󰊖"]
monocles = ["󰎤", "󰎧", "󰎪", "󰎭", "󰎱", "󰎳", "󰎶", "󰎹", "󰎼", "󰎿"]

[appearance]
border_width = 2
snap_distance = 16
gap_size = 10
icon_size = 16
icon_spacing = 5
fonts = ["Symbols Nerd Font Mono:size=10", "mononoki Nerd Font:size=10"]
dmenu_font = "mononoki Nerd Font:size=10"

[appearance.bar]
enable = true
top = true
padding_vertical = 8
padding_horizontal = 4
border_width = 2
border_color = #cc241d
status_separator = "|"

[appearance.bar.systray]
enable = true
pinning = 0
icon_size = 16
padding_vertical = 3
padding_horizontal = 8
pinning_fail_first = true
separator = "|"
# StatusNotifierItem host (needs a build with SNI support, the default)
sni = true
sni_watcher = true
prefer_sni = true
show_passive = false
tooltips = true
# icon_theme = "Papirus"

[appearance.padding]
vertical = 10
horizontal = 10

[theme.normal]
foreground = #d5c4a1
background = #1d2021
border = #32302f
foreground_opacity = 1.0
background_opacity = 0.9
border_opacity = 1.0

[theme.selected]
foreground = #fbf1c7
background = #cc241d
border = #cc241d
foreground_opacity = 1.0
background_opacity = 0.96
border_opacity = 1.0

[behavior]
right_master = false
scroll_sensitivity = 30
autostart_script = "$XDG_CONFIG_HOME/neowm/scripts/autostart"
resize_hints = true
master_factor = 0.5
master_count = 1
lock_fullscreen = true
refresh_rate = 120
smart_gaps = false

[status]
block  clock       command="$XDG_CONFIG_HOME/neowm/scripts/block_clock"       interval=60 timeout=10
block  wifi        command="$XDG_CONFIG_HOME/neowm/scripts/block_wifi"        interval=20 timeout=10
block  layout      command="$XDG_CONFIG_HOME/neowm/scripts/block_layout"      interval=0  timeout=10
block  battery     command="$XDG_CONFIG_HOME/neowm/scripts/block_battery"     interval=10 timeout=10
block  brightness  command="$XDG_CONFIG_HOME/neowm/scripts/block_brightness"  interval=0  timeout=10
block  volume      command="$XDG_CONFIG_HOME/neowm/scripts/block_volume"      interval=0  timeout=10

[scratchpads]
scratchpad  sptrm  class="sptrm"          command="st -n sptrm -c sptrm -g 120x30"
scratchpad  sptop  class="sptop"          command="st -n sptop -c sptop -g 120x30 -e btop"
scratchpad  sppmx  class="sppmx"          command="st -n sppmx -c sppmx -g 120x30 -e pulsemixer"
scratchpad  spflm  class="spflm"          command="st -n spflm -c spflm -g 120x30 -e yazi"
scratchpad  spmus  class="spmus"          command="st -n spmus -c spmus -g 120x30 -e subtui"
scratchpad  spani  class="spani"          command="st -n spani -c spani -g 120x30 -e ani-cli"
scratchpad  spyou  class="spyou"          command="st -n spyou -c spyou -g 120x30 -e youtube-tui"
scratchpad  spbit  class="Bitwarden"      command="flatpak run com.bitwarden.desktop"
scratchpad  spqal  class="Qalculate-gtk"  command="flatpak run io.github.Qalculate"
scratchpad  spscr  class="Arandr"         command="arandr"

[rules]
rule class="Galculator|Blueman-manager|Gpick|Kruler|Tor Browser|Wpa_gui|veromix|xtightvncviewer|Nextcloud|snx-rs-gui|Stoken-gui" floating=true
rule class="gnome-builder|lunarvim|Emacs|Godot|nvim|neovim|neovide" tag=1
rule class="Virt-manager|Org.gnome.Boxes" tag=2
rule class="LibreWolf|libreWolf|librewolf|librewolf-default|firefox|Firefox|Luakit|qutebrowser|Chromium|Brave-browser|thunderbird-esr" tag=3
rule class="Signal|Ferdium|ZapZap|Revolt|Element" tag=4
rule class="Audacity|Tenacity|Ardour|Carla2|Carla2-Control|qpwgraph|Cadence|easyeffects|kid3|flacon|FFaudioConverter" tag=5
rule class="QjackCtl|lsp-plugins" tag=5 floating=true
rule class="kdenlive|Pitivi|Natron|SimpleScreenRecorder|Ghb|mpv|^obs$" tag=6
rule class="Blender|Gimp-2.10|krita|Inkscape|Xournalpp|Com.github.xournalpp.xournalpp" tag=7
rule class="ONLYOFFICE Desktop Editors|libreoffice-.*|soffice|Joplin|obsidian|Notesnook|com.github.johnfactotum.Foliate" tag=8
rule class="steam|PrismLauncher|airshipper|pyrogenesis|DarkPlaces|xonotic-sdl|supertuxkart-sdl|supertux2|Minetest|openttd|warzone2100|wesnoth|retroarch|pcsx2-qt|duckstation-qt|Cemu|xemu|org.ppsspp.PPSSPP|dolphin-emu|es-de" tag=9

[layouts]
layout  ""  arrange=tile
layout  ""  arrange=floating
layout  ""  arrange=monocle
layout  ""  arrange=centeredmaster
layout  ""  arrange=centeredfloatingmaster
layout  ""  arrange=spiral
layout  ""  arrange=dwindle
layout  "󰝘"  arrange=grid

[keybinds]
bind  Mod4+Return            action=spawn          arg="st"
bind  Mod4+p r               action=spawn          arg="dmenu_run -fn 'mononoki Nerd Font:size=10' -nb '#1d2021' -nf '#d5c4a1' -sb '#cc241d' -sf '#fbf1c7'"
bind  Mod4+p d               action=spawn          arg="$XDG_SOURCE_HOME/dmenu/scripts/dmenu_drun"
bind  Mod4+p i               action=spawn          arg="$XDG_SOURCE_HOME/dmenu/scripts/dmenu_wifi"
bind  Mod4+p s               action=spawn          arg="$XDG_SOURCE_HOME/dmenu/scripts/dmenu_scrot"
bind  Mod4+p w               action=spawn          arg="$XDG_SOURCE_HOME/dmenu/scripts/dmenu_wall"
bind  Mod4+p o               action=spawn          arg="$XDG_SOURCE_HOME/dmenu/scripts/dmenu_open"
bind  Mod4+p e               action=spawn          arg="$XDG_SOURCE_HOME/dmenu/scripts/dmenu_emoji"
bind  Mod4+p b               action=spawn          arg="$XDG_SOURCE_HOME/dmenu/scripts/dmenu_blue"
bind  Mod4+p q               action=spawn          arg="$XDG_SOURCE_HOME/dmenu/scripts/dmenu_power"
bind  Mod4+p c               action=spawn          arg="clipmenu"
bind  Mod4+a e               action=spawn          arg="st -n nvim -c nvim -e nvim"
bind  Mod4+a w               action=spawn          arg="qutebrowser"
bind  Mod4+a c               action=spawn          arg="flatpak run org.signal.Signal"
bind  Mod4+a n               action=spawn          arg="flatpak run md.obsidian.Obsidian"
bind  Mod4+x                 action=spawn          arg="$XDG_CONFIG_HOME/neowm/scripts/kbd_layout && neowm -u layout"
bind  XF86AudioRaiseVolume   action=spawn          arg="pamixer -i 5 && neowm -u volume"
bind  XF86AudioLowerVolume   action=spawn          arg="pamixer -d 5 && neowm -u volume"
bind  XF86AudioMute          action=spawn          arg="pamixer -t && neowm -u volume"
bind  XF86AudioMicMute       action=spawn          arg="pamixer --default-source -t && neowm -u volume"
bind  XF86MonBrightnessUp    action=spawn          arg="brightnessctl s 5%+ && neowm -u brightness"
bind  XF86MonBrightnessDown  action=spawn          arg="brightnessctl s 5%- && neowm -u brightness"
bind  XF86KbdBrightnessUp    action=spawn          arg="brightnessctl --device='smc::kbd_backlight' s 10%+"
bind  XF86KbdBrightnessDown  action=spawn          arg="brightnessctl --device='smc::kbd_backlight' s 10%-"
bind  XF86AudioPause         action=spawn          arg="playerctl play-pause"
bind  XF86AudioPlay          action=spawn          arg="playerctl play-pause"
bind  XF86AudioNext          action=spawn          arg="playerctl next"
bind  XF86AudioPrev          action=spawn          arg="playerctl previous"
bind  XF86AudioStop          action=spawn          arg="playerctl stop"
bind  Mod4+j                 action=focusstack     arg=1
bind  Mod4+k                 action=focusstack     arg=-1
bind  Mod4+Shift+j           action=movestack      arg=-1
bind  Mod4+Shift+k           action=movestack      arg=1
bind  Mod4+i                 action=incnmaster     arg=1
bind  Mod4+d                 action=incnmaster     arg=-1
bind  Mod4+h                 action=setmfact       arg=-0.05
bind  Mod4+l                 action=setmfact       arg=0.05
bind  Mod4+Control+Return    action=zoom
bind  Mod4+Shift+Return      action=focusmaster
bind  Mod4+Mod1+Return       action=togglemaster
bind  Mod4+Shift+Tab         action=togglesticky
bind  Mod4+Tab               action=view
bind  Mod4+q                 action=killclient
bind  Mod4+c t               action=setlayout      arg=0
bind  Mod4+c f               action=setlayout      arg=1
bind  Mod4+c m               action=setlayout      arg=2
bind  Mod4+c c               action=setlayout      arg=3
bind  Mod4+c v               action=setlayout      arg=4
bind  Mod4+c s               action=setlayout      arg=5
bind  Mod4+c d               action=setlayout      arg=6
bind  Mod4+c g               action=setlayout      arg=7
bind  Mod4+Shift+space       action=setlayout
bind  Mod4+space             action=cyclelayout    arg=-1
bind  Mod4+Control+space     action=cyclelayout    arg=1
bind  Mod4+f                 action=fullscreen
bind  Mod4+Mod1+space        action=togglefloating
bind  Mod4+0                 action=view           arg="all"
bind  Mod4+Shift+0           action=tag            arg="all"
bind  Mod4+comma             action=focusmon       arg=1
bind  Mod4+period            action=focusmon       arg=-1
bind  Mod4+Shift+comma       action=tagmon         arg=1
bind  Mod4+Shift+period      action=tagmon         arg=-1
bind  Mod4+b                 action=togglebar
bind  Mod4+s Return          action=togglescratch  arg="sptrm"
bind  Mod4+s b               action=togglescratch  arg="sptop"
bind  Mod4+s p               action=togglescratch  arg="sppmx"
bind  Mod4+s f               action=togglescratch  arg="spflm"
bind  Mod4+s m               action=togglescratch  arg="spmus"
bind  Mod4+s a               action=togglescratch  arg="spani"
bind  Mod4+s y               action=togglescratch  arg="spyou"
bind  Mod4+s k               action=togglescratch  arg="spbit"
bind  Mod4+s c               action=togglescratch  arg="spqal"
bind  Mod4+s d               action=togglescratch  arg="spscr"
bind  Mod4+Control+Shift+q   action=quit
bind  Mod4+Control+r         action=restart
bind  Mod4+Right             action=viewnext
bind  Mod4+Left              action=viewprev
bind  Mod4+Shift+Right       action=tagtonext
bind  Mod4+Shift+Left        action=tagtoprev
bind  Mod4+1                 action=comboview      arg=1
bind  Mod4+2                 action=comboview      arg=2
bind  Mod4+3                 action=comboview      arg=3
bind  Mod4+4                 action=comboview      arg=4
bind  Mod4+5                 action=comboview      arg=5
bind  Mod4+6                 action=comboview      arg=6
bind  Mod4+7                 action=comboview      arg=7
bind  Mod4+8                 action=comboview      arg=8
bind  Mod4+9                 action=comboview      arg=9
bind  Mod4+Control+1         action=toggleview     arg=1
bind  Mod4+Control+2         action=toggleview     arg=2
bind  Mod4+Control+3         action=toggleview     arg=3
bind  Mod4+Control+4         action=toggleview     arg=4
bind  Mod4+Control+5         action=toggleview     arg=5
bind  Mod4+Control+6         action=toggleview     arg=6
bind  Mod4+Control+7         action=toggleview     arg=7
bind  Mod4+Control+8         action=toggleview     arg=8
bind  Mod4+Control+9         action=toggleview     arg=9
bind  Mod4+Shift+1           action=combotag       arg=1
bind  Mod4+Shift+2           action=combotag       arg=2
bind  Mod4+Shift+3           action=combotag       arg=3
bind  Mod4+Shift+4           action=combotag       arg=4
bind  Mod4+Shift+5           action=combotag       arg=5
bind  Mod4+Shift+6           action=combotag       arg=6
bind  Mod4+Shift+7           action=combotag       arg=7
bind  Mod4+Shift+8           action=combotag       arg=8
bind  Mod4+Shift+9           action=combotag       arg=9
bind  Mod4+Control+Shift+1   action=toggletag      arg=1
bind  Mod4+Control+Shift+2   action=toggletag      arg=2
bind  Mod4+Control+Shift+3   action=toggletag      arg=3
bind  Mod4+Control+Shift+4   action=toggletag      arg=4
bind  Mod4+Control+Shift+5   action=toggletag      arg=5
bind  Mod4+Control+Shift+6   action=toggletag      arg=6
bind  Mod4+Control+Shift+7   action=toggletag      arg=7
bind  Mod4+Control+Shift+8   action=toggletag      arg=8
bind  Mod4+Control+Shift+9   action=toggletag      arg=9

[buttons]
button  ClkLtSymbol    1            action=setlayout          arg=0
button  ClkLtSymbol    3            action=setlayout          arg=2
button  ClkWinTitle    2            action=zoom
button  ClkStatusText  2            action=spawn              arg="st"
button  ClkClientWin   1  mod=Mod4  action=moveorplace        arg=1
button  ClkClientWin   2  mod=Mod4  action=togglefloating
button  ClkClientWin   3  mod=Mod4  action=resizemouse
button  ClkClientWin   4  mod=Mod4  action=resizemousescroll  arg=0
button  ClkClientWin   5  mod=Mod4  action=resizemousescroll  arg=1
button  ClkClientWin   6  mod=Mod4  action=resizemousescroll  arg=2
button  ClkClientWin   7  mod=Mod4  action=resizemousescroll  arg=3
button  ClkTagBar      1            action=view
button  ClkTagBar      3            action=toggleview
button  ClkTagBar      1  mod=Mod4  action=tag
button  ClkTagBar      3  mod=Mod4  action=toggletag
